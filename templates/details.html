{% extends 'base.html' %}
{% block content %}
<div class="container">
    <div class="card" style="width: 18rem; margin: 1rem;">
        <img src="{{ trip.cover_url }}" class="card-img-top" alt="...">
        <div class="card-body">
            <h5 class="card-title">{{ trip.hotel }}, {{ trip.country }}</h5>
            <h6 class="card-title">Check-in date: {{ trip.checkin_date }}
                <br>Check-out date: {{ trip.checkout_date }}</h6>
            <p class="card-text">{{ trip.description }}</p>
        </div>
    </div>
</div>
{% endblock %}
